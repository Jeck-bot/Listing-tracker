name: CI

on:
  pull_request:
  push:
    branches: ['claude/**']

jobs:
  carousell-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright for the browser check
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Carousell reachability
        run: |
          node scanner/diagnose.mjs "chloe paddington" --browser
          node scanner/diagnose.mjs "balenciaga city"
